name: Build APK

on:
  workflow_dispatch: # 只允许手动点击

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Generate Keystore
      run: |
        keytool -genkeypair -v -keystore app/release.keystore -alias stvbox -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=STVBox, OU=Dev, O=Dev, L=SZ, ST=SZ, C=CN"

    - name: Build with Gradle
      run: ./gradlew :app:assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: STVBox-APK
        path: app/build/outputs/apk/release/*.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: STVBox Build ${{ github.run_number }}
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build APK

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0 

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Ensure Fixed Keystore
      run: |
        if [ ! -f app/release.keystore ]; then
          echo "首次生成固定签名文件..."
          keytool -genkeypair -v -keystore app/release.keystore -alias stvbox -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=STVBox, OU=Dev, O=Dev, L=SZ, ST=SZ, C=CN"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/release.keystore
          git commit -m "Add fixed release keystore [skip ci]"
          git push
        else
          echo "签名文件已在仓库中，直接使用！"
        fi

    # =========================================================
    # 【神技】抓取提交说明，并同时生成 txt 文档
    # =========================================================
    - name: Generate Changelog
      run: |
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREVIOUS_TAG" ]; then
          LOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s" --no-merges | grep -v "Auto bump version" | grep -v "Add fixed release keystore" || echo "- 优化细节与性能调整")
        else
          LOG="- 初始版本发布"
        fi
        
        # 存入环境变量，用于网页显示
        echo "CHANGELOG<<EOF" >> $GITHUB_ENV
        echo "🎉 **STVBox 更新内容**" >> $GITHUB_ENV
        echo "$LOG" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        
        # 【新增】生成一个 txt 文本文件，方便下载
        echo "STVBox 更新说明" > ReleaseNote.txt
        echo "====================" >> ReleaseNote.txt
        echo "$LOG" >> ReleaseNote.txt

    - name: Bump Version Before Build
      run: |
        python3 << 'EOF'
        import re
        import os
        file = 'app/build.gradle'
        content = open(file).read()
        
        code_match = re.search(r'versionCode\s+(\d+)', content)
        name_match = re.search(r"versionName\s+['\"]([\d\.]+)['\"]", content)
        
        if code_match and name_match:
            old_code = int(code_match.group(1))
            old_name = name_match.group(1)
            
            new_code = old_code + 1
            parts = old_name.split('.')
            parts[-1] = str(int(parts[-1]) + 1)
            new_name = '.'.join(parts)
            
            content = re.sub(r'versionCode\s+\d+', f'versionCode {new_code}', content)
            content = re.sub(r"versionName\s+['\"][\d\.]+['\"]", f"versionName '{new_name}'", content)
            open(file, 'w').write(content)
            
            with open(os.environ['GITHUB_ENV'], 'a') as env_file:
                env_file.write(f"NEW_VERSION={new_name}\n")
        EOF

    - name: Build with Gradle
      # 【核心修改】加入了 clean，强制清理缓存，确保新图标和新资源被彻底打包进去
      run: ./gradlew clean :app:assembleRelease --build-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: STVBox-v${{ env.NEW_VERSION }}
        path: app/build/outputs/apk/release/*.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.NEW_VERSION }}
        name: STVBox v${{ env.NEW_VERSION }}
        files: |
          app/build/outputs/apk/release/*.apk
          ReleaseNote.txt
        make_latest: true
        body: |
          ${{ env.CHANGELOG }}
          
          ---
          **安装提示**：请在电视盒子上直接覆盖安装，您的接口和配置数据将自动保留。
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Commit and Push
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto bump version to ${{ env.NEW_VERSION }} [skip ci]"
        file_pattern: app/build.gradle

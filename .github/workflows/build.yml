name: Build APK

on:
  workflow_dispatch: # 只允许手动点击运行

# 【新增】需要给 Action 写入 Releases 的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Generate Keystore
      run: |
        keytool -genkeypair -v -keystore app/release.keystore -alias stvbox -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=STVBox, OU=Dev, O=Dev, L=SZ, ST=SZ, C=CN"

    - name: Build with Gradle
      run: ./gradlew :app:assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TVBox-APK
        path: 'app/build/outputs/apk/release/*.apk'

    # 【新增神技】自动创建一个 Release 并上传 APK
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }} # 自动递增版本号，比如 v1.0.1, v1.0.2
        name: STVBox Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: 'app/build/outputs/apk/release/*.apk' # 上传的 apk 路径
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build APK

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    # =========================================================
    # 【核心修复】只生成一次签名，并直接推到仓库永久保存！
    # =========================================================
    - name: Ensure Fixed Keystore
      run: |
        if [ ! -f app/release.keystore ]; then
          echo "首次生成固定签名文件..."
          keytool -genkeypair -v -keystore app/release.keystore -alias stvbox -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=STVBox, OU=Dev, O=Dev, L=SZ, ST=SZ, C=CN"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/release.keystore
          git commit -m "Add fixed release keystore [skip ci]"
          git push
        else
          echo "签名文件已在仓库中，直接使用！"
        fi

    # 打包前先升级版本号
    - name: Bump Version Before Build
      run: |
        python3 << 'EOF'
        import re
        import os
        file = 'app/build.gradle'
        content = open(file).read()
        
        code_match = re.search(r'versionCode\s+(\d+)', content)
        name_match = re.search(r"versionName\s+['\"]([\d\.]+)['\"]", content)
        
        if code_match and name_match:
            old_code = int(code_match.group(1))
            old_name = name_match.group(1)
            
            new_code = old_code + 1
            parts = old_name.split('.')
            parts[-1] = str(int(parts[-1]) + 1)
            new_name = '.'.join(parts)
            
            content = re.sub(r'versionCode\s+\d+', f'versionCode {new_code}', content)
            content = re.sub(r"versionName\s+['\"][\d\.]+['\"]", f"versionName '{new_name}'", content)
            open(file, 'w').write(content)
            
            with open(os.environ['GITHUB_ENV'], 'a') as env_file:
                env_file.write(f"NEW_VERSION={new_name}\n")
        EOF

    - name: Build with Gradle
      run: ./gradlew :app:assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: STVBox-v${{ env.NEW_VERSION }}
        path: app/build/outputs/apk/release/*.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.NEW_VERSION }}
        name: STVBox v${{ env.NEW_VERSION }}
        files: app/build/outputs/apk/release/*.apk
        make_latest: true # 【加上这行，强制让每次发布的新版本都坐上“最新”的release清单】
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Commit and Push
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto bump version to ${{ env.NEW_VERSION }} [skip ci]"
        file_pattern: app/build.gradle

name: Build APK

on:
  workflow_dispatch: # 只允许手动点击运行

permissions:
  contents: write # 需要写入权限，以便自动提交代码

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 必须设为0，否则无法 push 回去

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Generate Keystore
      run: |
        keytool -genkeypair -v -keystore app/release.keystore -alias stvbox -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=STVBox, OU=Dev, O=Dev, L=SZ, ST=SZ, C=CN"

    - name: Build with Gradle
      run: ./gradlew :app:assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TVBox-APK
        path: 'app/build/outputs/apk/release/*.apk'

    # 1. 先获取当前的版本号，用来给 Release 命名
    - name: Get Current Version
      id: get_version
      run: |
        CURRENT_VERSION=$(grep "versionName" app/build.gradle | head -1 | sed -E "s/.*versionName ['\"](.*)['\"].*/\1/")
        echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

    # 2. 自动创建 Release
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.CURRENT_VERSION }}
        name: STVBox Release v${{ env.CURRENT_VERSION }}
        draft: false
        prerelease: false
        files: 'app/build/outputs/apk/release/*.apk'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ----------------------------------------------------
    # 👇👇👇 关键：以下步骤只有前面的 Build 彻底成功了才会执行！
    # ----------------------------------------------------
    
    # 3. 自动修改 build.gradle，把版本号 +0.0.1
    - name: Auto Bump Version
      if: success()
      run: |
        python3 - << 'EOF'
        import re

        file_path = 'app/build.gradle'
        with open(file_path, 'r', encoding='utf-8') as f:
            content = f.read()

        # 递增 versionCode
        code_match = re.search(r'versionCode\s+(\d+)', content)
        if code_match:
            current_code = int(code_match.group(1))
            new_code = current_code + 1
            content = content.replace(f'versionCode {current_code}', f'versionCode {new_code}')

        # 递增 versionName (例如 1.0.0 -> 1.0.1)
        name_match = re.search(r"versionName\s+['\"]([\d\.]+)['\"]", content)
        if name_match:
            current_name = name_match.group(1)
            parts = current_name.split('.')
            if len(parts) == 3:
                parts[2] = str(int(parts[2]) + 1)
            else:
                parts.append('1')
            new_name = '.'.join(parts)
            content = content.replace(f"versionName '{current_name}'", f"versionName '{new_name}'")
            content = content.replace(f'versionName "{current_name}"', f'versionName "{new_name}"')

        with open(file_path, 'w', encoding='utf-8') as f:
            f.write(content)
        EOF

    # 4. 将修改后的代码自动提交推送到仓库
    - name: Commit and Push Version Bump
      if: success()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add app/build.gradle
        git commit -m "Auto bump version [skip ci]"
        git push origin HEAD:${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

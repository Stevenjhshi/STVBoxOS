name: Build APK

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Generate Keystore
      run: |
        keytool -genkeypair -v -keystore app/release.keystore -alias stvbox -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=STVBox, OU=Dev, O=Dev, L=SZ, ST=SZ, C=CN"

    # 【安全提取】用 Python 拿版本号，绝不报错
    - name: Read Version
      id: ver
      run: |
        VERSION=$(python3 -c "import re; print(re.search(r\"versionName\s+['\\\"]([\\d\\.]+)['\\\"]\", open('app/build.gradle').read()).group(1))")
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Build with Gradle
      run: ./gradlew :app:assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: STVBox-v${{ env.VERSION }}
        path: app/build/outputs/apk/release/*.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: STVBox v${{ env.VERSION }}
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ==========================================
    # 👇 全自动升级：只有 Build 成功（全绿）才会执行到这步
    # ==========================================
    - name: Clean Keystore
      run: rm -f app/release.keystore

    - name: Auto Bump Version
      run: |
        python3 << 'EOF'
        import re
        file = 'app/build.gradle'
        content = open(file).read()
        
        # 精准递增 versionCode
        code_match = re.search(r'versionCode\s+(\d+)', content)
        if code_match:
            old_code = int(code_match.group(1))
            content = re.sub(r'versionCode\s+\d+', f'versionCode {old_code + 1}', content)
            
        # 精准递增 versionName
        name_match = re.search(r'versionName\s+[\'\"]([\d\.]+)[\'\"]', content)
        if name_match:
            old_name = name_match.group(1)
            parts = old_name.split('.')
            parts[-1] = str(int(parts[-1]) + 1)
            new_name = '.'.join(parts)
            content = re.sub(r'versionName\s+[\'\"][\d\.]+[\'\"]', f"versionName '{new_name}'", content)
            
        open(file, 'w').write(content)
        EOF

    - name: Commit and Push
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto bump version [skip ci]"
        file_pattern: app/build.gradle

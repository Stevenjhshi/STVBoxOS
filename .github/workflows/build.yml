name: Build APK

on:
  workflow_dispatch: # 手动触发

permissions:
  contents: write # 必须要有写入权限，才能自动帮你改代码提交

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 确保能 push 回去

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Generate Keystore
      run: |
        keytool -genkeypair -v -keystore app/release.keystore -alias stvbox -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=STVBox, OU=Dev, O=Dev, L=SZ, ST=SZ, C=CN"

    - name: Build with Gradle
      run: ./gradlew :app:assembleRelease

    - name: Get Version
      id: get_version
      run: |
        VERSION=$(grep -oP "(?<=versionName ')[^']+" app/build.gradle)
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: STVBox-v${{ env.APP_VERSION }}
        path: 'app/build/outputs/apk/release/*.apk'

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.APP_VERSION }}
        name: STVBox v${{ env.APP_VERSION }}
        draft: false
        prerelease: false
        files: 'app/build/outputs/apk/release/*.apk'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ==========================================
    # 👇 核心修改：换成最稳的 Bash 指令来改版本号
    # ==========================================
    - name: Auto Bump Version & Commit
      run: |
        # 1. 用最原始的方式提取数字
        OLD_CODE=$(grep "versionCode " app/build.gradle | awk '{print $2}')
        NEW_CODE=$((OLD_CODE + 1))
        
        OLD_NAME=$(grep "versionName " app/build.gradle | awk -F"'" '{print $2}')
        if [ -z "$OLD_NAME" ]; then
          OLD_NAME=$(grep "versionName " app/build.gradle | awk -F'"' '{print $2}')
        fi
        
        MAJOR=$(echo $OLD_NAME | cut -d. -f1)
        MINOR=$(echo $OLD_NAME | cut -d. -f2)
        PATCH=$(echo $OLD_NAME | cut -d. -f3)
        NEW_PATCH=$((PATCH + 1))
        NEW_NAME="$MAJOR.$MINOR.$NEW_PATCH"
        
        # 2. 强行替换
        sed -i "s/versionCode $OLD_CODE/versionCode $NEW_CODE/g" app/build.gradle
        sed -i "s/versionName '$OLD_NAME'/versionName '$NEW_NAME'/g" app/build.gradle
        sed -i "s/versionName \"$OLD_NAME\"/versionName \"$NEW_NAME\"/g" app/build.gradle
        
        # 3. 强制提交
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add app/build.gradle
        git commit -m "Auto bump version to $NEW_NAME [skip ci]"
        git push origin HEAD:${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
